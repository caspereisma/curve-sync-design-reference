name: visual-regression

# Keep the two `paths` lists in sync — GitHub Actions does not support YAML
# anchors, so they have to be spelled out twice.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      # Baseline changes are the highest-risk change to this suite, yet without
      # this path a rebaseline PR gets no checks at all (see PR #8).
      - 'screenshots/baseline/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/visual.yml'
  # Also run on main, so a red merge cannot stay invisible: PR #6 merged with a
  # failing check and nothing re-ran it until an unrelated PR tripped over it.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'screenshots/baseline/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/visual.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run visual regression
        run: pnpm test:visual
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
